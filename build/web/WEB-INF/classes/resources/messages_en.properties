# ================= BACKEND MESSAGES =================
# SUCCESS MESSAGES (SXXX)
# S001X: Account Security & Registration
S0010=Password changed successfully!
S0011=Account registered successfully!
S0012=Security key created successfully!

# S010X: User Profile
S0100=Profile updated successfully!

# S020X: POS, Cart & Orders
S0200=Order placed successfully! Your order has been recorded.
S0201=Item added to cart!
S0202=Cart updated successfully!
S0203=Item removed from cart!
S0204=Cart cleared successfully!
S0205=Order status updated successfully!
S0206=Order cancelled successfully! All ingredients have been returned to warehouse stock.
S0207=Dish exchanged successfully! Total amount recalculated and inventory updated.
S0208=Added new menu item successfully!
S0209=Updated menu item successfully!
S0210=Updated menu item business status successfully!

# S9XXX: System Administration
S9000=Account status updated successfully!

# ERROR MESSAGES (EXXX)
# E000X: Authentication & Login
E0001=Invalid or empty username!
E0002=Invalid password (minimum 3 characters)!
E0003=Role cannot be empty!
E0004=This account does not have permission for the selected role!
E0005=Incorrect username or password!

# E001X: Account Security & Registration
E0010=Incorrect old password!
E0011=Confirm password does not match!
E0012=New password cannot be the same as the old password!
E0013=Username already exists!
E0014=Email is already in use by another account!
E0016=This account has been banned!

# E010X: User Profile
E0100=Profile information not found!
IE0101=Not updated yet

# E100X: Raw Data Format Validation (Layer 1)
E1000=Username must be at least 5 characters long!
E1001=Password contains invalid characters!
E1002=Email cannot be empty!
E1003=Invalid email format!
E1004=Phone number cannot be empty!
E1005=Invalid phone number format!
E1006=Address cannot be empty!
E1007=Invalid security code!
E1008=Username cannot be empty!
E1009=Product name cannot be empty!
E1010=Product price is invalid, must be greater than 0!
E1011=Please select a category for the product!
E1012=Invalid image format (only .jpg, .jpeg, .png, .webp allowed)!
E1013=Image size exceeds maximum limit (max 10MB)!
E1014=Image upload failed, please try again!
E1015=Image URL is too long (maximum 255 characters)! Please use a shorter URL or choose a file from your computer.

# E020X: POS, Cart, Orders & Kitchen
E0200=Your cart is empty! Please select items before checkout.
E0201=Invalid table information!
E0202=Product not found or out of ingredients!
E0203=Order not found!
E0204=Invalid order status!
E0205=Insufficient ingredients in stock to prepare this order! The item has been marked as unavailable on the Menu.
E0206=Cannot exchange dish or cancel order because cooking has already started!
E0207=Order is not in an eligible status to be cancelled!
E0208=The selected replacement dish is not available or out of ingredients!
E0209=The cancelled order has exceeded the 5-minute window and is locked from modification!
E0210=Product name already exists on the menu!
E0211=Requested product not found!

# E9XXX: Administration & System
E9000=Invalid action!

# DATABASE ERROR MESSAGES (DEXXX)
# System & Transaction
DE009=System database transaction error!

# Users (User DAO)
DE0002=Database error retrieving user list!
DE0003=Database error updating account status!
DE0004=Database error finding user by username!
DE0005=Database error finding user by ID!
DE0006=Database error finding user by email!
DE0007=Database error updating user profile!
DE008=Database error creating new user!

# Security Keys (AccountManager DAO)
DE0000=Database error retrieving security key list!
DE0001=Database error generating new security key!
DE0010=Database error assigning security key to user!

# Menu & Products (Product DAO)
DE0012=Database error retrieving product information!
DE0013=Database error updating product!

# Inventory & Ingredients (Ingredient DAO)
DE0014=Database error retrieving ingredient stock!
DE0015=Database error updating ingredient inventory!

# Orders (Order DAO)
DE0011=System error while saving order to database!
DE0016=Database error retrieving orders list!
DE0017=Database error updating order status!

