E0402=T\u00ean nguy\u00ean li\u1ec7u \u0111\u00e3 t\u1ed3n t\u1ea1i trong kho!
E0403=Ng\u01b0\u1ee1ng c\u1ea3nh b\u00e1o kh\u00f4ng h\u1ee3p l\u1ec7, ph\u1ea3i l\u00e0 s\u1ed1 kh\u00f4ng \u00e2m!
E0404=T\u00ean v\u00e0 \u0111\u01a1n v\u1ecb t\u00ednh nguy\u00ean li\u1ec7u kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng!
E0405=Gi\u00e1 nguy\u00ean li\u1ec7u kh\u00f4ng h\u1ee3p l\u1ec7, ph\u1ea3i l\u00e0 s\u1ed1 kh\u00f4ng \u00e2m!
E0406=S\u1ed1 l\u01b0\u1ee3ng t\u1ed3n kho kh\u00f4ng h\u1ee3p l\u1ec7, ph\u1ea3i l\u00e0 s\u1ed1 kh\u00f4ng \u00e2m!
E0407=B\u1ea1n kh\u00f4ng c\u00f3 quy\u1ec1n th\u1ef1c hi\u1ec7n thao t\u00e1c n\u00e0y (ch\u1ec9 d\u00e0nh cho Qu\u1ea3n l\u00fd)!
E0408=D\u1eef li\u1ec7u nguy\u00ean li\u1ec7u kh\u00f4ng h\u1ee3p l\u1ec7!
E0409=T\u00ean danh m\u1ee5c nguy\u00ean li\u1ec7u kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng!
E0410=T\u00ean danh m\u1ee5c nguy\u00ean li\u1ec7u \u0111\u00e3 t\u1ed3n t\u1ea1i!
E0411=Danh m\u1ee5c \u0111ang ch\u1ee9a nguy\u00ean li\u1ec7u, kh\u00f4ng th\u1ec3 x\u00f3a!
E0501=Kh\u00f4ng t\u00ecm th\u1ea5y th\u00f4ng tin c\u1ea3nh b\u00e1o t\u1ed3n kho!
E0601=M\u00e3 \u0111\u01a1n h\u00e0ng giao kh\u00f4ng h\u1ee3p l\u1ec7 ho\u1eb7c kh\u00f4ng t\u00ecm th\u1ea5y th\u00f4ng tin giao h\u00e0ng!
E0602=B\u1ea1n kh\u00f4ng c\u00f3 quy\u1ec1n thao t\u00e1c tr\u00ean \u0111\u01a1n h\u00e0ng n\u00e0y ho\u1eb7c Shipper kh\u00f4ng s\u1eb5n s\u00e0ng!
E0603=Tr\u1ea1ng th\u00e1i c\u1eadp nh\u1eadt kh\u00f4ng h\u1ee3p l\u1ec7 (\u0110\u01a1n \u0111\u00e3 \u0111\u00f3ng lu\u1ed3ng ho\u1eb7c b\u1ecb g\u00e1n cho ng\u01b0\u1eddi kh\u00e1c)!
E0604=\u0110\u01a1n h\u00e0ng n\u00e0y \u0111\u00e3 \u0111\u01b0\u1ee3c \u0111i\u1ec1u ph\u1ed1i cho Shipper kh\u00e1c!
E0605=Kh\u00f4ng th\u1ec3 t\u1eeb ch\u1ed1i \u0111\u01a1n h\u00e0ng \u0111\u00e3 b\u1eaft \u0111\u1ea7u giao!
E0606=Nh\u00e2n vi\u00ean Shipper n\u00e0y \u0111\u00e3 \u0111\u1ea1t gi\u1edbi h\u1ea1n \u0111\u01a1n h\u00e0ng \u0111ang giao (t\u1ed1i \u0111a 3 \u0111\u01a1n)!
E0607=Vui l\u00f2ng nh\u1eadp l\u00fd do giao h\u00e0ng th\u1ea5t b\u1ea1i / ho\u00e0n \u0111\u01a1n!
E0701=T\u00ean ca l\u00e0m vi\u1ec7c kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng!
E0702=Khung gi\u1edd ca l\u00e0m vi\u1ec7c kh\u00f4ng h\u1ee3p l\u1ec7 (Gi\u1edd k\u1ebft th\u00fac ph\u1ea3i sau Gi\u1edd b\u1eaft \u0111\u1ea7u)!
E0703=Ca l\u00e0m vi\u1ec7c v\u1edbi t\u00ean n\u00e0y \u0111\u00e3 t\u1ed3n t\u1ea1i!
E0704=Nh\u00e2n vi\u00ean \u0111\u00e3 \u0111\u01b0\u1ee3c ph\u00e2n c\u00f4ng ca l\u00e0m vi\u1ec7c n\u00e0y trong ng\u00e0y \u0111\u00e3 ch\u1ecdn!
E0705=Kh\u00f4ng th\u1ec3 h\u1ee7y ph\u00e2n ca \u0111\u00e3 c\u00f3 d\u1eef li\u1ec7u ch\u1ea5m c\u00f4ng!
E0706=Kh\u00f4ng th\u1ec3 x\u00f3a ca l\u00e0m vi\u1ec7c n\u00e0y!
E0707=Kh\u00f4ng t\u00ecm th\u1ea5y b\u1ea3n ghi ch\u1ea5m c\u00f4ng!
E0708=\u0110\u1ecbnh d\u1ea1ng ng\u00e0y th\u00e1ng kh\u00f4ng h\u1ee3p l\u1ec7!
E0709=Kh\u00f4ng t\u00ecm th\u1ea5y th\u00f4ng tin nh\u00e2n vi\u00ean!
E0710=B\u1ea1n ch\u1ec9 \u0111\u01b0\u1ee3c \u0111i\u1ec3m danh v\u00e0o ca tr\u01b0\u1edbc gi\u1edd b\u1eaft \u0111\u1ea7u t\u1ed1i \u0111a 15 ph\u00fat!
E0711=Ch\u01b0a \u0111\u1ebfn gi\u1edd k\u1ebft th\u00fac ca l\u00e0m vi\u1ec7c, ch\u01b0a th\u1ec3 \u0111i\u1ec3m danh tan ca!
E0712=Kho\u1ea3ng ng\u00e0y kh\u00f4ng h\u1ee3p l\u1ec7 (Ng\u00e0y k\u1ebft th\u00fac ph\u1ea3i sau ho\u1eb7c b\u1eb1ng Ng\u00e0y b\u1eaft \u0111\u1ea7u)!
E0713=Vui l\u00f2ng ch\u1ecdn \u00edt nh\u1ea5t m\u1ed9t ng\u00e0y trong tu\u1ea7n \u0111\u1ec3 ph\u00e2n ca!
E0714=Kh\u00f4ng c\u00f3 ph\u00e2n ca m\u1edbi n\u00e0o \u0111\u01b0\u1ee3c t\u1ea1o do \u0111\u00e3 b\u1ecb tr\u00f9ng l\u1ecbch!
E0715=Ch\u1ec9 \u0111\u01b0\u1ee3c ph\u00e2n ca l\u00e0m vi\u1ec7c cho nh\u00e2n vi\u00ean (Staff)!
E0716=B\u1ea1n kh\u00f4ng c\u00f3 ca l\u00e0m vi\u1ec7c n\u00e0o \u0111\u01b0\u1ee3c ph\u00e2n c\u00f4ng trong ng\u00e0y h\u00f4m nay!
E0717=B\u1ea1n \u0111\u00e3 \u0111i\u1ec3m danh v\u00e0o ca h\u00f4m nay r\u1ed3i!
E0718=B\u1ea1n ch\u01b0a \u0111i\u1ec3m danh v\u00e0o ca h\u00f4m nay!
E0719=B\u1ea1n \u0111\u00e3 \u0111i\u1ec3m danh tan ca h\u00f4m nay r\u1ed3i!
E0720=Kh\u00f4ng th\u1ec3 tan ca! B\u1ea1n c\u00f2n \u0111\u01a1n h\u00e0ng t\u1ea1i qu\u1ea7y ch\u01b0a ho\u00e0n th\u00e0nh.
E0721=Vui l\u00f2ng nh\u1eadp l\u00fd do l\u00e0m th\u00eam gi\u1edd (OT)!
E0801=N\u1ed9i dung ph\u00e1t thanh th\u00f4ng b\u00e1o kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng!
E0802=Kh\u00f4ng t\u00ecm th\u1ea5y th\u00f4ng b\u00e1o!
E9000=Thao t\u00e1c y\u00eau c\u1ea7u kh\u00f4ng h\u1ee3p l\u1ec7!
E9001=Qu\u1ea3n tr\u1ecb vi\u00ean kh\u00f4ng th\u1ec3 t\u1ef1 c\u1ea5p l\u1ea1i m\u1eadt kh\u1ea9u c\u1ee7a ch\u00ednh m\u00ecnh t\u1ea1i m\u00e0n h\u00ecnh n\u00e0y!
E9002=Qu\u1ea3n tr\u1ecb vi\u00ean kh\u00f4ng th\u1ec3 t\u1ef1 thay \u0111\u1ed5i vai tr\u00f2 ho\u1eb7c h\u1ea1 quy\u1ec1n c\u1ee7a ch\u00ednh m\u00ecnh!
E9003=Vai tr\u00f2 \u0111\u01b0\u1ee3c ch\u1ecdn kh\u00f4ng h\u1ee3p l\u1ec7 (ch\u1ec9 ch\u1ea5p nh\u1eadn Manager, Staff, Shipper)!
E9004=M\u00e3 b\u1ea3o m\u1eadt \u0111\u00e3 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng ho\u1eb7c kh\u00f4ng \u1edf tr\u1ea1ng th\u00e1i c\u00f3 th\u1ec3 thu h\u1ed3i!
E9005=Kh\u00f4ng th\u1ec3 thay \u0111\u1ed5i vai tr\u00f2 c\u1ee7a Shipper \u0111ang c\u00f3 \u0111\u01a1n h\u00e0ng giao d\u1edf dang!
E9006=Tab c\u00e0i \u0111\u1eb7t kh\u00f4ng h\u1ee3p l\u1ec7!

